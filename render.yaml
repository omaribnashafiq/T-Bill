services:
  - type: web
    name: t-bill
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tbill-db
          property: connectionString

databases:
  - name: tbill-db
    plan: free
    databaseName: tbill
